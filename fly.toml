app = 'cvmakerpro'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  # Must match ASPNETCORE_URLS in the Dockerfile.
  internal_port = 8080
  force_https = true

  # Suspend when idle and wake on the next request. An unvisited deployment costs almost
  # nothing; the trade is a few seconds on the first request after a quiet spell, and a few
  # more on the first export while Chromium starts. Set min_machines_running = 1 if this is
  # linked somewhere it needs to feel instant.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # A render holds a Chromium page for a second or two, so queue rather than pile on.
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = '20s'
  interval = '30s'
  method = 'GET'
  path = '/api/health'
  timeout = '5s'

[[vm]]
  # 1GB is the floor. Chromium launches on 512MB, renders a page, then gets OOM-killed
  # partway through a longer document — which surfaces as a random export failure rather
  # than anything that mentions memory.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
